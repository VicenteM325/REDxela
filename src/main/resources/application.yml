server:
  port: 8080

spring:
  application:
    name: redxela
  web:
    resources:
      cache:
        cachecontrol:
          # Los estáticos del jar llevan Last-Modified fijo (build reproducible), así que el navegador los
          # daría por frescos casi indefinidamente y mostraría una interfaz vieja tras reconstruir.
          no-store: true
  datasource:
    # H2 en modo archivo: los datos sobreviven a los reinicios (carpeta ./data, ignorada por git)
    url: jdbc:h2:file:./data/redxela;AUTO_SERVER=FALSE
    username: sa
    password: ""
  sql:
    init:
      mode: always

redxela:
  simulation:
    # Milisegundos reales que dura un minuto simulado (a velocidad 1x) y trabajo por unidad
    ms-per-sim-minute: 1000
    minutes-per-unit: 0.25
  dispatcher:
    # AGING | STRICT_PRIORITY | SHORTEST_FIRST | FCFS
    policy: AGING
    max-in-flight: 40
    # Pausa real entre recursos en los modos de adquisición incremental (ORDERED/NATURAL)
    acquisition-pause-ms: 400
  generator:
    rate-per-sim-minute: 1.0
    autostart: false
  warehouse:
    # Capacidad total = pasillos x niveles x posiciones x capacidad por ubicación (5x4x4x25 = 2000 u.)
    aisles: 5
    levels: 4
    positions: 4
    slot-capacity: 25
  inventory:
    # Tiempo (simulado) que Inventario tarda en registrar un lote: base + por unidad
    base-minutes: 0.2
    minutes-per-unit: 0.02
    initial-stock-per-product: 60
  reception:
    # Capacidad del canal Recepción -> Inventario y tiempo de escaneo de cada lote
    queue-capacity: 10
    scan-minutes: 0.2
    timeout-ms: 3000
  restock:
    # Reposición automática (proveedores simulados)
    autostart: false
    check-every-minutes: 5
    reorder-point: 30
    lot-size: 100
  deadlock:
    # Cada cuánto (ms reales) el detector revisa el grafo de espera
    check-period-ms: 250
